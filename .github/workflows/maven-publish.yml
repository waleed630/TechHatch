name: Build jar and dockerize

on:
  push:
    branches: [main]
    paths :
      - 'server/**'
  pull_request:
    branches: [main]

jobs:
  build-jar:
    name: Builds jar
    runs-on: ubuntu-latest
    steps:
      - name : checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK and cache Maven deps
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'   

      # the context test needs a MySQL database, so only the unit tests run here
      - name: Run unit tests
        working-directory: server
        run: mvn -B test -Dtest='!TechhatchApplicationTests'

      - name: Build with maven (skip tests)
        working-directory: server
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with: 
          name: techhatch-jar
          path: server/target/*.jar
          
  build-docker:
    name : Builds docker image
    needs: build-jar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name : checkout repo
        uses : actions/checkout@v4

      - name : Login to GHCR
        run : echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name : Build docker image
        run : docker build -t ghcr.io/${{ github.repository_owner }}/techhatch-app:latest server/

      - name : Push to GHCR
        if : github.event_name == 'push'
        run : docker push ghcr.io/${{ github.repository_owner }}/techhatch-app:latest
